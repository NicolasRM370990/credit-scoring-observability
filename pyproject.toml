[project]
name = "credit-scoring-observability"
version = "0.1.0"
description = "Observabilidade Contínua, Detecção de Drift, Qualidade de Dados e Governança em Produção"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "evidently>=0.7.23,<0.8",
    "jinja2>=3.1",
    "kagglehub>=1.0.2",
    "matplotlib>=3.11.2",
    "mlflow>=3.0",
    "pandas>=2.2,<3",         
    "pandera>=0.30",
    "plotly>=5.24",
    "pyarrow>=17",
    "pydantic>=2.14.1",
    "pyyaml>=6",
    "scikit-learn>=1.5",
    "scipy>=1.13",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/creditwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]   # EDA fica fora do lint
